# This workflow will help you to produce an HTML extra test results report

name: Newman Tests

on:
  push:
  pull_request:

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install Newman and HTML Extra Reporter
      - name: Install Newman
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      # Create directory for test results
      - name: Create Test Results Directory
        run: mkdir -p testResults

      # Run Postman collection
      - name: Run API Tests
        run: |
          newman run "Restful Booker BVT.postman_collection.json" \
            -e "Production.postman_environment.json" \
            -r htmlextra \
            --reporter-htmlextra-export "testResults/htmlreport.html"

      # Upload HTML report as GitHub Artifact
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: RunReports
          path: testResults/
          if-no-files-found: error
